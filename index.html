  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { background: var(--margen); -webkit-tap-highlight-color: transparent; font-family: 'Forum', serif; color: var(--gris); }
  body.cerrado { overflow: hidden; height: 100%; }
  html:has(> body.cerrado) { background: #F4F4F4; overscroll-behavior: none; }
  ::selection { background: rgba(176, 42, 85, .18); color: var(--azul); }
  :focus-visible { outline: 2px solid var(--dani); outline-offset: 3px; border-radius: 4px; }

  /* ---------- Sobre de entrada (el mismo de la invitación) ---------- */
  #intro { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 50; background: #F4F4F4; display: flex; flex-direction: column;
    align-items: center; justify-content: center; cursor: pointer; transition: opacity .9s ease;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
  #intro.fuera { opacity: 0; pointer-events: none; }
  #intro .encima { margin: 0 0 6vh; color: var(--azul); font-size: 30px; font-size: clamp(26px, 7.4vw, 38px); letter-spacing: .02em; text-align: center; line-height: 1.1; transition: opacity .3s ease; }
  #intro.abre .encima { opacity: 0; }
  #intro .encima small { display: block; margin-top: .55em; color: var(--gris); font-size: 12.5px; letter-spacing: .32em; padding-left: .32em; }
  .sobre { --sw: min(84vw, 400px, 58vh * 1.42); flex: none; position: relative; width: var(--sw); height: calc(var(--sw) / 1.42); perspective: 1100px; }
  @supports (height: 1svh) {
    .sobre { --sw: min(84vw, 400px, 58svh * 1.42); }
    #intro .encima { margin-bottom: 6svh; }
    .toca { margin-top: 6svh; }
  }
  .interior { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: #000A31; box-shadow: 0 12px 24px rgba(1, 13, 61, .28); }
  .caja-carta { position: absolute; z-index: 2; left: 6%; width: 88%; bottom: 2px; height: 400%; overflow: hidden; }
  .carta { position: absolute; left: 0; width: 100%; height: 24%; top: 80%; background: var(--papel);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 4%;
    transition: transform 1.2s cubic-bezier(.3, 0, .2, 1); }
  .carta .mono { width: 16%; height: calc(var(--sw) * .181); margin-bottom: 4%; background: #9a9a9a; -webkit-mask: var(--mono) center / contain no-repeat; mask: var(--mono) center / contain no-repeat; }
  .carta p { margin: 0; color: var(--gris); font-size: calc(var(--sw) * .034); letter-spacing: .3em; padding-left: .3em; }
  .bolsillo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; }
  .solapa { position: absolute; left: 0; top: 0; width: 100%; height: 58%; z-index: 4; transform-origin: 50% 0;
    transform-style: preserve-3d; -webkit-transform-style: preserve-3d; transition: transform .85s cubic-bezier(.45, .05, .25, 1); }
  .cara { position: absolute; top: 0; right: 0; bottom: 0; left: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .cara svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: visible; }
  .dorso { transform: rotateX(180deg); }
  .lacre { position: absolute; left: 50%; top: 100%; width: calc(var(--sw) * .27); height: calc(var(--sw) * .27); transform: translate(-50%, -52%);
    border-radius: 50%; background: var(--lacre); box-shadow: inset 0 0 0 calc(var(--sw) * .006) #8B6C4C, 0 2px 4px rgba(0, 0, 0, .25); }
  .lacre::before, .sello::before { content: ""; position: absolute; top: 6.5%; right: 6.5%; bottom: 6.5%; left: 6.5%; border-radius: 50%; border: calc(var(--sw) * .004) solid #85664A; }
  .lacre .cd, .sello .cd { position: absolute; top: 15%; right: 15%; bottom: 15%; left: 15%; }
  .lacre .cd { filter: drop-shadow(calc(var(--sw) * -.0017) calc(var(--sw) * -.0017) 0 rgba(242, 222, 192, .55)) drop-shadow(calc(var(--sw) * .0017) calc(var(--sw) * .0017) 0 rgba(66, 44, 24, .4)); }
  .lacre .cd::before, .sello .cd::before { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: #8C6C4E;
    -webkit-mask: var(--mono) center / contain no-repeat; mask: var(--mono) center / contain no-repeat; }
  .toca { margin: 6vh 0 0; color: #606060; font-size: 13px; letter-spacing: .32em; padding-left: .32em; animation: latido 2.2s ease-in-out infinite; }
  @keyframes latido { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  #intro.abre .solapa { transform: rotateX(180deg); }
  #intro.atras .solapa { z-index: 1; }
  #intro.sube .carta { transform: translateY(-70%); }
  #intro.abre .toca { opacity: 0; animation: none; transition: opacity .3s; }
  @media (prefers-reduced-motion: reduce) { .toca { animation: none; opacity: 1; } }
  /* Música: el mismo botón flotante de la invitación (pausa / play), dentro de la columna */
  #musica { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom)); right: max(14px, calc(50% - var(--W) / 2 + 14px)); z-index: 45; width: 44px; height: 44px; border-radius: 50%;
    border: 1.5px solid var(--lacre); background: rgba(35, 37, 78, .9); box-shadow: 0 3px 10px rgba(10, 14, 30, .35); padding: 0; cursor: pointer; display: none;
    align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #musica.ver { display: flex; }
  #musica svg { width: 18px; height: 18px; fill: #e2cfaa; }
  #musica .ic-play { display: none; } #musica.pausada .ic-play { display: block; } #musica.pausada .ic-pausa { display: none; }
  #musica:not(.pausada)::after { content: ""; position: absolute; top: -5px; right: -5px; bottom: -5px; left: -5px; border-radius: 50%; border: 1px solid rgba(157, 124, 90, .55); animation: onda-musica 2.4s ease-out infinite; }
  @keyframes onda-musica { from { transform: scale(.85); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #musica:not(.pausada)::after { animation: none; opacity: 0; } }
</style>

    padding: calc(30 * var(--u)) calc(150 * var(--u)) calc(60 * var(--u)); text-align: center; -webkit-text-stroke: calc(.5 * var(--u)) currentColor; }
  .raya { width: calc(66.4 * var(--u)); height: max(1px, calc(1.735 * var(--u))); background: var(--azul); margin: 0 auto; }
  h1, h2, h3, p { font-weight: 400; margin: 0; }
  h1 { color: var(--azul); font-size: calc(118 * var(--u)); line-height: 1; letter-spacing: .01em; text-wrap: balance; }
  h1:focus { outline: none; }
  .sub { margin-top: calc(34 * var(--u)); font-size: max(.75rem, calc(26 * var(--u))); letter-spacing: .3em; padding-left: .3em; }
  .intro { margin: calc(70 * var(--u)) auto 0; font-size: max(1.0625rem, calc(40 * var(--u))); line-height: 1.45; max-width: 30ch; text-wrap: pretty; }
  .sec { margin-top: calc(190 * var(--u)); }
  .sec h2 { margin-top: calc(42 * var(--u)); font-size: max(.75rem, calc(28 * var(--u))); letter-spacing: .26em; padding-left: .26em; line-height: 1.3; }
  .num { display: block; margin-top: calc(40 * var(--u)); color: var(--azul); font-size: calc(190 * var(--u)); line-height: .95; letter-spacing: -.01em;
    font-variant-numeric: tabular-nums; -webkit-text-stroke: 0; }
  .num.chico { font-size: calc(150 * var(--u)); }
  .que { display: block; margin-top: calc(18 * var(--u)); color: var(--azul); font-size: max(1.1875rem, calc(44 * var(--u))); line-height: 1.2; }
  .txt { margin: calc(46 * var(--u)) auto 0; font-size: max(1.0625rem, calc(40 * var(--u))); line-height: 1.5; max-width: 32ch; text-wrap: pretty; }
  .txt b { font-weight: 400; color: var(--azul); }
  .txt + .txt { margin-top: calc(26 * var(--u)); }
  .chele, .dani { white-space: nowrap; }
  .chele::before, .dani::before { content: ""; display: inline-block; width: .5em; height: .5em; border-radius: 50%; margin-right: .3em; vertical-align: .06em; }
  .chele::before { background: var(--chele); } .dani::before { background: var(--dani); }

  /* cuatro datos chicos */
  .datos { display: grid; grid-template-columns: repeat(2, 1fr); gap: calc(40 * var(--u)) calc(30 * var(--u)); margin-top: calc(70 * var(--u)); }
  .datos div { display: flex; flex-direction: column; }
  .datos strong { font-weight: 400; color: var(--azul); font-size: max(1.75rem, calc(78 * var(--u))); line-height: 1; font-variant-numeric: tabular-nums; -webkit-text-stroke: 0; }
  .datos span { margin-top: calc(8 * var(--u)); font-size: max(.75rem, calc(24 * var(--u))); letter-spacing: .24em; padding-left: .24em; }

  /* barra partida: Chele a la izquierda, Dani a la derecha, como en todos los gráficos */
  .partida { margin-top: calc(70 * var(--u)); }
  .partida .rot { display: flex; justify-content: space-between; font-size: max(.9375rem, calc(34 * var(--u))); color: var(--azul); }
  .partida .rot small { display: block; font-size: max(.8125rem, calc(26 * var(--u))); color: var(--gris); letter-spacing: .04em; }
  .partida .rot div { text-align: left; } .partida .rot div:last-child { text-align: right; }
  .barra { display: flex; height: calc(44 * var(--u)); margin-top: calc(18 * var(--u)); }
  .barra i { display: block; height: 100%; }
  .barra i:first-child { background: var(--chele); border-radius: 4px 0 0 4px; margin-right: 2px; }
  .barra i:last-child { background: var(--dani); border-radius: 0 4px 4px 0; }

  /* mapa de calor: horas en filas, días en columnas */
  .calor { position: relative; margin: calc(70 * var(--u)) auto 0; display: grid; grid-template-columns: max(32px, calc(70 * var(--u))) repeat(7, 1fr); gap: 2px;
    -webkit-text-stroke: 0; touch-action: manipulation; }
  .calor .dia { font-size: max(.6875rem, calc(22 * var(--u))); letter-spacing: .1em; padding: 0 0 calc(10 * var(--u)); color: var(--gris); }
  .calor .hora { font-size: max(.6875rem, calc(22 * var(--u))); color: var(--gris); text-align: right; padding-right: calc(12 * var(--u)); line-height: 1; align-self: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .calor .c { height: calc(30 * var(--u)); border-radius: 2px; background: var(--h0); }
  .calor .c.pico { box-shadow: 0 0 0 2px var(--papel), 0 0 0 calc(2px + max(1.5px, calc(3 * var(--u)))) var(--azul); position: relative; z-index: 1; }
  .calor .c.sel { box-shadow: 0 0 0 2px var(--papel), 0 0 0 4px var(--azul); position: relative; z-index: 2; }
  .escala { display: flex; align-items: center; justify-content: center; margin-top: calc(30 * var(--u)); font-size: max(.75rem, calc(24 * var(--u))); -webkit-text-stroke: 0; }
  .escala i { width: calc(40 * var(--u)); height: calc(22 * var(--u)); border-radius: 2px; margin: 0 calc(5 * var(--u)); }
  .escala span { margin: 0 calc(6 * var(--u)); }
  .escala .sep { margin-left: calc(26 * var(--u)); }

  /* emojis */
  .emojis { display: grid; grid-template-columns: 1fr 1fr; gap: calc(50 * var(--u)); margin-top: calc(70 * var(--u)); text-align: left; }
  .emojis h3 { font-size: max(.8125rem, calc(30 * var(--u))); letter-spacing: .2em; color: var(--azul); margin-bottom: calc(24 * var(--u)); }
  .emojis ol { list-style: none; margin: 0; padding: 0; display: grid; gap: calc(22 * var(--u)); }
  .emojis li { display: grid; grid-template-columns: max(1.9rem, calc(78 * var(--u))) 1fr; align-items: center; gap: calc(14 * var(--u)); }
  .emojis .e { font-size: max(1.5rem, calc(62 * var(--u))); line-height: 1; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; -webkit-text-stroke: 0; }
  .emojis .v { display: flex; flex-direction: column; font-size: max(.875rem, calc(30 * var(--u))); color: var(--azul); font-variant-numeric: tabular-nums; }
  .emojis .v i { display: block; margin-top: calc(8 * var(--u)); height: calc(10 * var(--u)); min-height: 3px; border-radius: 0 4px 4px 0; }
  .emojis .col-chele .v i { background: var(--chele); } .emojis .col-dani .v i { background: var(--dani); }
  .dos { margin-top: calc(80 * var(--u)); }
  .dos .grande { display: block; font-size: calc(170 * var(--u)); line-height: 1; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; -webkit-text-stroke: 0; }

  /* duelos: cada número pegado a su barra, eje en el centro */
  .leyenda { display: flex; justify-content: center; margin-top: calc(60 * var(--u)); font-size: max(.875rem, calc(30 * var(--u))); color: var(--azul); }
  .leyenda span { margin: 0 calc(20 * var(--u)); }
  .duelos { margin-top: calc(40 * var(--u)); display: grid; gap: calc(44 * var(--u)); }
  .duelo .pal { font-size: max(1.125rem, calc(44 * var(--u))); color: var(--azul); }
  .duelo .fila { display: grid; grid-template-columns: 1fr 1fr; margin-top: calc(12 * var(--u)); font-size: max(.875rem, calc(30 * var(--u))); font-variant-numeric: tabular-nums; -webkit-text-stroke: 0; }
  .duelo .lado { display: flex; align-items: center; }
  .duelo .lado.izq { justify-content: flex-end; margin-right: 1px; } .duelo .lado.der { margin-left: 1px; }
  .duelo .lado i { display: block; flex: none; height: calc(30 * var(--u)); min-width: 2px; }
  .duelo .lado.izq i { background: var(--chele); border-radius: 4px 0 0 4px; } .duelo .lado.izq span { margin-right: calc(12 * var(--u)); }
  .duelo .lado.der i { background: var(--dani); border-radius: 0 4px 4px 0; } .duelo .lado.der span { margin-left: calc(12 * var(--u)); }

  /* meses */
  .meses { position: relative; margin-top: calc(80 * var(--u)); display: flex; align-items: flex-end; height: calc(430 * var(--u)); -webkit-text-stroke: 0; touch-action: manipulation; }
  .mes { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; position: relative; margin: 0 1px; }
  .mes .pila { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; width: min(100%, calc(60 * var(--u))); }
  .mes i { display: block; width: 100%; }
  .mes.sel .pila { filter: brightness(1.12); }
  .mes .d { background: var(--dani); border-radius: 4px 4px 0 0; }
  .mes .c { background: var(--chele); margin-top: 2px; }
  .mes .val { position: absolute; left: 50%; transform: translateX(-50%); font-size: max(.6875rem, calc(24 * var(--u))); color: var(--azul); white-space: nowrap; }
  .ejes { display: flex; margin-top: calc(12 * var(--u)); font-size: max(.6875rem, calc(22 * var(--u))); letter-spacing: .1em; -webkit-text-stroke: 0; }
  .ejes span { flex: 1; margin: 0 1px; white-space: nowrap; }
  .hito { position: absolute; bottom: 0; top: calc(-30 * var(--u)); border-left: 1px solid rgba(35, 37, 78, .45); }
  .hito span { position: absolute; top: 0; left: calc(8 * var(--u)); font-size: max(.6875rem, calc(22 * var(--u))); color: var(--azul); white-space: nowrap; }

  /* cierre */
  .cierre { margin-top: calc(220 * var(--u)); padding-bottom: calc(40 * var(--u)); }
  .cierre .si { display: block; margin-top: calc(40 * var(--u)); color: var(--azul); font-size: calc(175 * var(--u)); line-height: 1; -webkit-text-stroke: 0; }
  .cierre .fecha { margin-top: calc(40 * var(--u)); font-size: max(.75rem, calc(30 * var(--u))); letter-spacing: .3em; padding-left: .3em; }
  .sello { --sw: calc(1000 * var(--u)); position: relative; width: calc(170 * var(--u)); height: calc(170 * var(--u)); margin: calc(80 * var(--u)) auto 0;
    border-radius: 50%; background: var(--lacre); box-shadow: inset 0 0 0 calc(var(--sw) * .006) #8B6C4C, 0 2px 4px rgba(0, 0, 0, .25); }
  .firma { margin-top: calc(40 * var(--u)); color: var(--azul); font-size: max(1.5rem, calc(64 * var(--u))); }
  .nota { margin: calc(110 * var(--u)) auto 0; font-size: max(.75rem, calc(24 * var(--u))); line-height: 1.6; max-width: 46ch; letter-spacing: .02em; }

  /* tooltip */
  .tip { position: absolute; z-index: 5; pointer-events: none; background: var(--azul); color: var(--papel); font-size: 14px; line-height: 1.3; padding: 7px 10px; border-radius: 6px;
    box-shadow: 0 6px 18px rgba(1, 13, 61, .25); transform: translate(-50%, calc(-100% - 6px)) scale(.96); transform-origin: 50% 100%; opacity: 0;
    transition: opacity .15s var(--curva), transform .15s var(--curva); white-space: pre-line; width: max-content; text-align: center; -webkit-text-stroke: 0; }
  .tip.ver { opacity: 1; transform: translate(-50%, calc(-100% - 10px)); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* aparición: visible por defecto, la anima solo el script */
  .js .rev { opacity: 0; transform: translateY(calc(30 * var(--u))); transition: opacity 1.1s var(--curva), transform 1.1s var(--curva); }
  .js .rev.vis { opacity: 1; transform: none; }
  /* cada gráfico y cada cifra arrancan recién cuando se ven, no cuando asoma la sección; en fila, uno tras otro */
  .js .rev [data-to] { opacity: 0; transition: opacity .25s ease; }
  .js .rev [data-to].anda { opacity: 1; }
  .js .crece { transform-origin: left center; transform: scaleX(0); transition: transform 1.3s var(--curva) calc(.1s + var(--i, 0) * 70ms); }
  .js .meses .crece { transform-origin: bottom center; transform: scaleY(0); }
  .js .anda .crece { transform: none; }
  .js .meses .val { opacity: 0; transition: opacity .4s ease calc(.6s + var(--i, 0) * 70ms); }
  .js .meses.anda .val { opacity: 1; }
  /* el lacre del cierre se estampa cuando se ve */
  .js .cierre .sello { opacity: 0; transform: scale(1.15); transition: opacity .3s ease-out .2s, transform .55s cubic-bezier(.34, 1.56, .64, 1) .2s; }
  .js .cierre .sello.anda { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .js .rev, .js .crece, .js .rev [data-to], .js .meses .val, .js .cierre .sello { opacity: 1; transform: none; transition: none; }
  }

     <div class="barra crece"><i style="flex:${D.chele}"></i><i style="flex:${D.dani}"></i></div>
   </div>
   <p class="txt">${pd >= pc ? 'Dani' : 'Chele'} escribe más.${D.respMedianSec.dani == null || D.respMedianSec.chele == null ? '' : ` ${nom(masRapida)} contesta más rápido: la mitad de las veces responde en menos de <b>${seg(D.respMedianSec[masRapida])}</b>. ${nom(otra)}, en ${seg(D.respMedianSec[otra])}.`}</p>
   ${buenDia ? `<p class="txt">${buenDia}</p>` : ''}`);

// 4. a qué hora
const DIA3 = ['LUN','MAR','MIÉ','JUE','VIE','SÁB','DOM'];
const maxC = Math.max(...D.heat.flat());
const nivel = v => v === 0 ? 0 : Math.min(5, 1 + Math.floor(Math.pow(v / maxC, .75) * 5));
let grid = `<div></div>` + DIA3.map(d => `<div class="dia">${d}</div>`).join('');
for (let h = 0; h < 24; h++) {
  grid += `<div class="hora">${h % 3 === 0 ? h + ' h' : ''}</div>`;
  for (let w = 0; w < 7; w++) {
    const v = D.heat[w][h], pico = w === D.peakCell.wd && h === D.peakCell.h;
    grid += `<div class="c${pico ? ' pico' : ''}" style="background:var(--h${nivel(v)})" data-tip="${DIAS_PL[w]} ${h} h · ${n(v)} en total"></div>`;
  }
}
// cuántos lunes, martes... entran en el período, para comparar promedios y no sumas
const cuantos = Array(7).fill(0);
for (let t = Date.UTC(ini.y, ini.m - 1, ini.d); t <= Date.UTC(fin.y, fin.m - 1, fin.d); t += 864e5) cuantos[(new Date(t).getUTCDay() + 6) % 7]++;
const promSemana = D.heat.map((r, i) => r.reduce((a, b) => a + b, 0) / Math.max(1, cuantos[i]));
const minD = promSemana.indexOf(Math.min(...promSemana)), maxD = promSemana.indexOf(Math.max(...promSemana));
const madrugada = D.hours.indexOf(Math.min(...D.hours.slice(2, 6)), 2);
const horaTexto = h => h === 12 ? 'a las 12 del mediodía' : h === 0 ? 'a medianoche' : `a la${h % 12 === 1 ? '' : 's'} ${h > 12 ? h - 12 : h} de la ${h < 6 ? 'madrugada' : h < 12 ? 'mañana' : h < 20 ? 'tarde' : 'noche'}`;
H += sec('A QUÉ HORA', `<span class="num chico">${D.peakHour}:00</span><span class="que">es nuestra hora</span>` +
  `<div class="calor" id="calor" role="img" aria-label="Mapa de mensajes por día de la semana y hora. El momento con más mensajes es el ${DIAS[D.peakCell.wd]} ${horaTexto(D.peakCell.h)}.">${grid}</div>
   <div class="escala" aria-hidden="true"><span>0</span><i style="background:var(--h0)"></i><span class="sep">menos</span><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i><i style="background:var(--h5)"></i><span>más</span></div>
   <p class="txt">El momento más movido de toda la semana: <b>el ${DIAS[D.peakCell.wd]} ${horaTexto(D.peakCell.h)}</b>. Sumando todos los ${DIAS_PL[D.peakCell.wd]}, en esa sola hora nos mandamos ${n(D.peakCell.v)} mensajes.</p>
   <p class="txt">El ${DIAS[minD]} es el día más tranquilo: ${n(Math.round(promSemana[minD]))} mensajes en promedio, contra ${n(Math.round(promSemana[maxD]))} un ${DIAS[maxD]}. ${horaTexto(madrugada).replace(/^a/, 'A')}: ${D.hours[madrugada] === 0 ? 'cero. Por lo menos dormimos.' : n(D.hours[madrugada]) + ' en total.'}</p>`);

// 5. emojis (una sola escala para los dos)
const EM = e => e.replace(/[❤♥]/g, m => m + '️');
const mxE = Math.max(1, ...[D.emojiTop.chele[0], D.emojiTop.dani[0]].filter(Boolean).map(x => x[1]));
const lista = (arr, k) => `<ol>${arr.slice(0, k).map(([e, v], i) => `<li><span class="e">${EM(e)}</span><span class="v">${n(v)}<i class="crece" style="width:${Math.max(4, v / mxE * 100)}%;--i:${i}"></i></span></li>`).join('')}</ol>`;
const segundo = D.emojiTop.all[1] || null;
const segDeChele = segundo ? (D.emojiTop.chele.find(x => x[0] === segundo[0]) || [0, 0])[1] : 0;
const segDeDani = segundo ? (D.emojiTop.dani.find(x => x[0] === segundo[0]) || [0, 0])[1] : 0;
const veces = D.emojiTot.chele / Math.max(1, D.emojiTot.dani);
const R = Math.round(veces);
H += sec('LOS EMOJIS', big(D.emojiTot.chele + D.emojiTot.dani, 'emojis') +
  `<p class="txt"><span class="chele">Chele</span> mandó ${n(D.emojiTot.chele)}. <span class="dani">Dani</span>, ${n(D.emojiTot.dani)}. ${veces >= 2 ? `${veces < R ? 'Casi' : 'Más de'} ${R} por cada uno de Dani.` : ''}</p>
   <div class="emojis graf"><div class="col-chele"><h3><span class="chele">CHELE</span></h3>${lista(D.emojiTop.chele, 5)}</div>
   <div class="col-dani"><h3><span class="dani">DANI</span></h3>${lista(D.emojiTop.dani, 4)}</div></div>
   ${segundo ? `<div class="dos"><span class="grande">${EM(segundo[0])}</span>
   <p class="txt">Nuestro emoji número 2. ${segDeChele === segundo[1] ? `Los ${n(segundo[1])} los mandó Chele.` : segDeDani === segundo[1] ? `Los ${n(segundo[1])} los mandó Dani.` : `Lo usamos ${n(segundo[1])} veces.`}</p></div>` : ''}`);

// 6. palabra por palabra
const DUELOS = [['ok', 'ok'], ['dale', 'dale'], ['boda', 'boda'], ['gracias', 'gracias'], ['jaja', 'jaja']];
const mxD = Math.max(...DUELOS.map(([k]) => Math.max(P.chele[k], P.dani[k])));
const ancho = v => Math.max(1, v / mxD * 74);
const okDale = P.chele.ok > P.dani.ok && P.dani.dale > P.chele.dale;
H += sec('PALABRA POR PALABRA',
  `<div class="leyenda" aria-hidden="true"><span class="chele">Chele</span><span class="dani">Dani</span></div>
   <div class="duelos graf">${DUELOS.map(([k, pal], i) => `<div class="duelo" role="img" aria-label="${pal}: Chele ${P.chele[k]}, Dani ${P.dani[k]}">
     <div class="pal">“${pal}”</div>
     <div class="fila"><div class="lado izq"><span>${n(P.chele[k])}</span><i class="crece" style="width:${ancho(P.chele[k])}%;transform-origin:right center;--i:${i}"></i></div><div class="lado der"><i class="crece" style="width:${ancho(P.dani[k])}%;--i:${i}"></i><span>${n(P.dani[k])}</span></div></div></div>`).join('')}</div>
   ${okDale ? `<p class="txt">Ella dice “ok”, él dice “dale”.</p>` : ''}
   <p class="txt">El jaja más largo tuvo <b>${D.longestJaja.len} letras</b>. Lo escribió ${nom(D.longestJaja.w)}.</p>
   <p class="txt">Y escribimos “nomás” <b>${n(suma('nomas'))} veces</b>. Muy paraguayos.</p>`);

// 7. mes a mes
const claves = Object.keys(D.months).sort();
const tot = k => D.months[k].dani + D.months[k].chele;
const mxM = Math.max(...claves.map(tot));
const record = claves.reduce((a, k) => tot(k) > tot(a) ? k : a, claves[0]);
const varios = new Set(claves.map(k => k.slice(0, 4))).size > 1;
const mesParcial = k => (k === claves[0] && ini.d > 1) || (k === claves[claves.length - 1] && fin.d < 28);
const etiqueta = k => { const [y, m] = k.split('-').map(Number); return MESES[m - 1].slice(0, 3) + (varios && m === 1 ? ` ${String(y).slice(2)}` : '') + (mesParcial(k) ? '*' : ''); };
const mostrarVal = claves.length <= 8;
// los dos tramos van en una sola pila que crece desde el piso, así el azul nunca flota sobre un hueco
const barras = claves.map((k, i) => { const t = tot(k), alt = t / mxM * 100;
  return `<div class="mes" style="--i:${i}" data-tip="${MESES[Number(k.slice(5)) - 1]} ${k.slice(0, 4)} · ${n(t)} mensajes\nChele ${n(D.months[k].chele)} · Dani ${n(D.months[k].dani)}">
    ${mostrarVal || k === record ? `<span class="val" style="bottom:calc(${alt}% + 6px)">${n(t)}</span>` : ''}
    <span class="pila crece"><i class="d" style="height:${D.months[k].dani / mxM * 100}%"></i><i class="c" style="height:${D.months[k].chele / mxM * 100}%"></i></span></div>`; }).join('');
const hitos = HITOS.filter(([d]) => claves.includes(d.slice(0, 7)) && d.slice(0, 7) !== claves[claves.length - 1])
  .map(([d, txt]) => `<div class="hito" style="left:${(claves.indexOf(d.slice(0, 7)) + .5) / claves.length * 100}%"><span>${txt}</span></div>`).join('');
const fr = fecha(record + '-01');
const dTop = fecha(D.topDays[0][0]);
const parcial = [];
if (ini.d > 1) parcial.push(`${MESES[ini.m - 1]}${varios ? ' de ' + ini.y : ''} cuenta desde el ${ini.d}`);
if (fin.d < 28) parcial.push(`${MESES[fin.m - 1]}${varios ? ' de ' + fin.y : ''} llega hasta el ${fin.d}`);
const cercaBoda = record >= '2026-06';
H += sec('MES A MES',
  `<div class="leyenda" aria-hidden="true"><span class="chele">Chele</span><span class="dani">Dani</span></div>
   <div class="meses graf" role="img" aria-label="Mensajes por mes: ${claves.map(k => `${MESES[Number(k.slice(5)) - 1]} ${n(tot(k))}`).join(', ')}. El récord fue ${MESES[fr.m - 1]} de ${fr.y}, con ${n(tot(record))} mensajes.">${barras}${hitos}</div>
   <div class="ejes" aria-hidden="true">${claves.map(k => `<span>${claves.length > 14 && Number(k.slice(5)) % 3 !== 1 ? '' : etiqueta(k)}</span>`).join('')}</div>
   ${parcial.length ? `<p class="nota" style="margin-top:calc(24 * var(--u))">* ${parcial.join(' y ').replace(/^./, c => c.toUpperCase())}.</p>` : ''}
   <p class="txt">El mes récord fue <b>${MESES[fr.m - 1]}${varios ? ' de ' + fr.y : ''}</b>: ${n(tot(record))} mensajes.${cercaBoda ? ' Se nota que la boda se organizó por WhatsApp.' : ''}</p>
   <p class="txt">El día que más hablamos fue el <b>${DIAS[dTop.dow]} ${dTop.txt}${varios ? ' de ' + dTop.y : ''}</b>: ${n(D.topDays[0][1])} mensajes en un solo día.</p>
   <p class="txt">${D.streak.to === D.lastDay ? `Al ${fecha(D.lastDay).txt} llevábamos <b>${n(D.streak.len)} días seguidos</b> escribiéndonos, sin faltar uno.` : `Nuestra racha más larga: <b>${n(D.streak.len)} días seguidos</b> escribiéndonos.`}</p>`);

// 8. cierre
H += `<section class="cierre rev"><div class="raya"></div>
  <p class="txt">Después de ${n(D.n)} mensajes${completo ? '' : ` solo desde ${MESES[ini.m - 1]}`}, el más importante nos lo dijimos en persona:</p>
  <span class="si">Sí, acepto</span>
  <p class="fecha">24 · 10 · 2026 · CASA PUENTE</p>
  <div class="sello" aria-hidden="true"><span class="cd"></span></div>
  <p class="firma">Chele &amp; Dani</p>
  <p class="nota">Contado a partir de nuestro chat de WhatsApp, ${periodo}. Solo se contaron mensajes, horas, palabras y emojis.</p>
</section>`;

cuerpo.innerHTML = H;
document.getElementById('carta-n').textContent = `${n(D.n)} MENSAJES`;
armado = true;
} catch (err) {
  // si algo falla, la carta no queda trabada: se abre y avisa
  document.documentElement.classList.remove('js');
  cuerpo.innerHTML = '<p class="txt" style="padding:20vh 0">No se pudo armar la historia en este celular. Probá abrir el link en otro navegador.</p>';
}

// ---------- papel: el tile se estira apenas para que el cuerpo termine justo en una unión ----------
function ajustar() {
  const r = cuerpo.getBoundingClientRect();
  const T = r.width * 833 / 1000, k = Math.max(1, Math.round(r.height / T));
  cuerpo.style.backgroundSize = `100% ${(r.height / k) * 3}px`;
}
ajustar();
addEventListener('resize', ajustar);
addEventListener('orientationchange', ajustar);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajustar);

// ---------- aparición y conteo ----------
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmtN = new Intl.NumberFormat('es-PY');
function contar(el) {
  const to = Number(el.dataset.to); if (!to || reduce) return;
  // Forum no tiene cifras tabulares: mientras cuenta, ancho fijo de la cifra final para que no tiemble de costado
  const rg = document.createRange(); rg.selectNodeContents(el);
  el.style.cssText = `width:${Math.ceil(rg.getBoundingClientRect().width) + 1}px;margin-left:auto;margin-right:auto;text-align:left;white-space:nowrap`;
  const t0 = performance.now(), dur = 1500;
  const paso = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(2, -10 * p);
    el.textContent = fmtN.format(Math.round(to * (p >= 1 ? 1 : e)));
    if (p < 1) requestAnimationFrame(paso); else el.removeAttribute('style'); };
  requestAnimationFrame(paso);
}
// las secciones aparecen al asomar; los gráficos, las cifras y el lacre recién cuando ya están a la vista
const hayIO = 'IntersectionObserver' in window;
const ioSec = hayIO && new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('vis'); ioSec.unobserve(e.target); } }), { rootMargin: '0px 0px -10% 0px' });
const ioDato = hayIO && new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { const el = e.target; ioDato.unobserve(el); el.classList.add('anda'); if (el.dataset.to) contar(el); } }), { rootMargin: '0px 0px -25% 0px' });
function revisar() {
  document.querySelectorAll('.rev').forEach(el => hayIO ? ioSec.observe(el) : el.classList.add('vis'));
  document.querySelectorAll('.graf, [data-to], .cierre .sello').forEach(el => hayIO ? ioDato.observe(el) : el.classList.add('anda'));
}

// ---------- tooltip (mouse y toque) ----------
const tip = document.getElementById('tip');
let fijo = null;
function mostrar(el, x, y) {
  const r = hoja.getBoundingClientRect();
  tip.textContent = el.dataset.tip;
  const m = tip.offsetWidth / 2 + 8;
  tip.style.left = Math.min(r.width - m, Math.max(m, x - r.left)) + 'px';
  tip.style.top = (y - r.top) + 'px';
  tip.classList.add('ver');
}
// la casilla o el mes que se está mirando queda marcado, para saber de cuál es el número
let sel = null;
const marcar = el => { if (el === sel) return; if (sel) sel.classList.remove('sel'); sel = el; if (el) el.classList.add('sel'); };
hoja.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; const el = e.target.closest('[data-tip]');
  if (el) { mostrar(el, e.clientX, e.clientY); marcar(el); } else { tip.classList.remove('ver'); marcar(null); } });
hoja.addEventListener('pointerleave', () => { tip.classList.remove('ver'); marcar(null); });
hoja.addEventListener('click', e => { const el = e.target.closest('[data-tip]');
  if (el && el !== fijo) { const b = el.getBoundingClientRect(); mostrar(el, b.left + b.width / 2, b.top); fijo = el; marcar(el); }
  else { tip.classList.remove('ver'); fijo = null; marcar(null); } });
// una sola vez: al ver el mapa, el globo del momento más movido avisa que las casillas se pueden tocar
function pistaPico() {
  const pk = document.querySelector('.calor .pico'); if (!pk || !hayIO) return;
  const iop = new IntersectionObserver(es => { if (!es[0].isIntersecting) return; iop.disconnect();
    setTimeout(() => { if (fijo) return; const b = pk.getBoundingClientRect(); mostrar(pk, b.left + b.width / 2, b.top); fijo = pk; marcar(pk); }, 1600); },
    { rootMargin: '0px 0px -30% 0px' });
  iop.observe(pk);
}

// ---------- Música: Mi corazón encantado (violín), igual que en la invitación ----------
// No se baja nada de audio hasta que la página terminó de cargar. Safari necesita la canción entera en memoria (blob);
// el resto suena directo mientras baja. Si tocan el sobre antes, arranca sola apenas está.
const cancion = window.__cancion || new Audio(), btnMusica = document.getElementById('musica');
cancion.loop = true;
const MP3 = 'audio/mi_corazon_encantado.mp3', SILENCIO = window.__SILENCIO;
const ua = navigator.userAgent;
const esSafari = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) || (/Safari/.test(ua) && !/Chrome|Chromium|CriOS|FxiOS|Edg|OPR|Android/.test(ua));
let fuente = null, puesta = false, pedida = false, quiere = false, pausadaPorSalir = false;
function bajarCancion() {
  if (pedida) return; pedida = true;
  fetch(MP3).then(r => r.ok ? r.blob() : Promise.reject())
    .then(b => { fuente = URL.createObjectURL(b); }, () => { fuente = MP3; })
    .then(() => { if (quiere) arrancar(); });
}
function ponerDirecta() { if (puesta) return; fuente = MP3; cancion.preload = 'auto'; cancion.src = fuente; puesta = true; }
function arrancar() {
  if (!puesta) { cancion.src = fuente; puesta = true; }
  if (document.hidden) { pausadaPorSalir = true; return; }
  const p = cancion.play(); if (p && p.catch) p.catch(() => btnMusica.classList.add('pausada'));
}
function sonar() {                                    // siempre se llama desde un toque
  quiere = true;
  if (fuente) return arrancar();
  if (!puesta && SILENCIO) { cancion.src = SILENCIO; const p = cancion.play(); if (p && p.catch) p.catch(() => {}); }
}
function paginaLista() { if (esSafari) bajarCancion(); else { ponerDirecta(); if (quiere) arrancar(); } }
if (document.readyState === 'complete') paginaLista(); else addEventListener('load', paginaLista, { once: true });
cancion.addEventListener('play', () => btnMusica.classList.remove('pausada'));
cancion.addEventListener('pause', () => btnMusica.classList.add('pausada'));
btnMusica.addEventListener('click', () => { if (cancion.paused) sonar(); else { quiere = false; cancion.pause(); } });
document.addEventListener('visibilitychange', () => {       // no sigue sonando en el bolsillo; vuelve al volver
  if (document.hidden && !cancion.paused) { pausadaPorSalir = true; cancion.pause(); }
  else if (!document.hidden && pausadaPorSalir) { pausadaPorSalir = false; if (quiere) sonar(); }
});
if ('mediaSession' in navigator && window.MediaMetadata) navigator.mediaSession.metadata = new MediaMetadata({ title: 'Mi corazón encantado (violín)', album: 'Chele & Dani · 24.10.2026' });

// ---------- abrir el sobre ----------
let abierto = false;
function listo() {
  const tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.content = '#28344E';
  document.body.classList.remove('cerrado'); hoja.removeAttribute('aria-hidden'); scrollTo(0, 0); revisar(); ajustar(); pistaPico();
  const h1 = cuerpo.querySelector('h1'); if (h1) h1.focus({ preventScroll: true });
}
function abrir() {
  if (abierto) return; abierto = true;
  sonar(); btnMusica.classList.add('ver');                  // la música arranca con el toque (requisito de iPhone)
  if (reduce || !armado) { intro.classList.add('fuera'); listo(); setTimeout(() => intro.remove(), 900); return; }
  intro.classList.add('abre');
  setTimeout(() => intro.classList.add('atras'), 430);
  setTimeout(() => intro.classList.add('sube'), 750);
  setTimeout(() => { intro.classList.add('fuera'); listo(); }, 2300);
  setTimeout(() => intro.remove(), 3300);
}
window.__abrir = abrir;
if (window.__pidio) abrir();
</script>
